<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Level-Up Gamer</title>

    <link rel="stylesheet" href="registro.css">
</head>

<body>

    <!-- Botón para volver al inicio -->
    <a href="../index.html" class="btn-inicio">
        🏠 Inicio
    </a>

    <!-- Imagen principal del registro -->
    <img
        src="../img/registro-dragon.png"
        alt="Registro Level-Up Gamer"
        class="imagen-registro"
    >

    <!-- Formulario de registro -->
    <form id="formRegistro">

        <!-- RUN -->
        <label for="run">RUN:</label>

        <input
            type="text"
            id="run"
            minlength="7"
            maxlength="9"
            placeholder="Ej: 19011022K"
        >

        <span id="errorRun"></span>


        <!-- NOMBRE -->
        <label for="nombre">Nombre:</label>

        <input
            type="text"
            id="nombre"
            maxlength="50"
        >

        <span id="errorNombre"></span>


        <!-- APELLIDOS -->
        <label for="apellidos">Apellidos:</label>

        <input
            type="text"
            id="apellidos"
            maxlength="100"
        >

        <span id="errorApellidos"></span>


        <!-- CORREO -->
        <label for="correo">Correo:</label>

        <input
            type="email"
            id="correo"
            maxlength="100"
            placeholder="Ej: usuario@gmail.com"
        >

        <span id="errorCorreo"></span>


        <!-- CONTRASEÑA -->
        <label for="password">Contraseña:</label>

        <input
            type="password"
            id="password"
            minlength="4"
            maxlength="10"
            placeholder="Entre 4 y 10 caracteres"
        >

        <span id="errorPassword"></span>


        <!-- CONFIRMAR CONTRASEÑA -->
        <label for="confirmarPassword">
            Confirmar contraseña:
        </label>

        <input
            type="password"
            id="confirmarPassword"
            minlength="4"
            maxlength="10"
            placeholder="Repita su contraseña"
        >

        <span id="errorConfirmarPassword"></span>


        <!-- FECHA DE NACIMIENTO -->
        <label for="fechaNacimiento">
            Fecha de nacimiento:
        </label>

        <input
            type="date"
            id="fechaNacimiento"
        >

        <span id="errorFecha"></span>


        <!-- REGIÓN -->
        <label for="region">Región:</label>

        <select id="region">

            <option value="">
                Seleccione una región
            </option>

        </select>

        <span id="errorRegion"></span>


        <!-- COMUNA -->
        <label for="comuna">Comuna:</label>

        <select id="comuna">

            <option value="">
                Seleccione una comuna
            </option>

        </select>

        <span id="errorComuna"></span>


        <!-- DIRECCIÓN -->
        <label for="direccion">Dirección:</label>

        <input
            type="text"
            id="direccion"
            maxlength="300"
        >

        <span id="errorDireccion"></span>


        <!-- BOTÓN -->
        <button type="submit">
            Registrarse
        </button>

    </form>


    <script src="registro.js"></script>

</body>

</html>
