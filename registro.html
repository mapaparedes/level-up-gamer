<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Level-Up Gamer</title>
    <link rel="stylesheet" href="registro.css">
</head>


<body>
   <!-- Imagen principal del registro -->
     <img src="img/registro-dragon.png"
     alt="Registro"
     class="imagen-registro">

     

 

    <form id="formRegistro">

        <label for="run">RUN:</label>
        <input type="text" id="run" placeholder="Ej: 19011022K">
        <span id="errorRun"></span>
          
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">
        <span id="errorNombre"></span>
       

        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos">
        <span id="errorApellidos"></span>
         
        <label for="correo">Correo:</label>
        <input type="email" id="correo">
        <span id="errorCorreo"></span>
         

        <label for="fechaNacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fechaNacimiento">
        <span id="errorFecha"></span>
         

        <label for="region">Región:</label>
        <select id="region">
            <option value="">Seleccione una región</option>
        </select>
        

        <label for="comuna">Comuna:</label>
        <select id="comuna">
            <option value="">Seleccione una comuna</option>
        </select>
         

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion">
        <span id="errorDireccion"></span>
         

        <button type="submit">Registrarse</button>

    </form>

    <script src="registro.js"></script>

</body>
</html>
