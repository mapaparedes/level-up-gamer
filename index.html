<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#101714">
	<title>Level-Up Gamer | Sube de nivel</title>
	<style>
		:root {
			color-scheme: dark;
			--fondo: #101714;
			--superficie: #1b2520;
			--texto: #f3f4ec;
			--suave: #bac3b9;
			--verde: #c5f467;
			--linea: #344238;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			background-image:
				linear-gradient(
					rgba(0, 0, 0, 0.2),
					rgba(0, 0, 0, 0.42)
				),
				url("img/login-cthulhu.png");
			background-color: var(--fondo);
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			background-attachment: fixed;
			color: var(--texto);
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
		}

		a {
			color: inherit;
			text-decoration: none;
		}

		.barra-superior {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 24px;
			max-width: 1240px;
			min-height: 78px;
			margin: 0 auto;
			padding: 16px 32px;
			border-bottom: 1px solid var(--linea);
		}

		.marca {
			flex: 0 0 auto;
			font-size: 18px;
			font-weight: 800;
		}

		.marca span {
			color: var(--verde);
		}

		.navegacion {
			display: flex;
			flex-wrap: wrap;
			justify-content: flex-end;
			gap: 8px 22px;
		}

		.navegacion a {
			color: var(--suave);
			font-size: 14px;
			transition: color 160ms ease;
		}

		.navegacion a:hover,
		.navegacion a:focus-visible {
			color: var(--verde);
		}

		.portada {
			display: grid;
			grid-template-columns: minmax(0, 1fr);
			align-items: end;
			max-width: 1240px;
			min-height: calc(100vh - 78px);
			margin: 0 auto;
			padding: 48px 32px 64px;
		}

		.portada-texto {
			max-width: 600px;
			animation: aparecer 500ms ease-out both;
			text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
		}

		.sobrelinea {
			margin: 0 0 18px;
			color: var(--verde);
			font-size: 12px;
			font-weight: 800;
			letter-spacing: 1.5px;
			text-transform: uppercase;
		}

		h1 {
			max-width: 620px;
			margin: 0;
			font-size: clamp(42px, 6vw, 76px);
			line-height: 0.98;
		}

		.portada-texto > p:not(.sobrelinea) {
			max-width: 460px;
			margin: 24px 0 30px;
			color: var(--suave);
			font-size: 17px;
			line-height: 1.6;
		}

		.boton-principal {
			display: inline-flex;
			min-height: 48px;
			align-items: center;
			justify-content: center;
			padding: 0 22px;
			background: var(--verde);
			color: #182013;
			font-size: 14px;
			font-weight: 800;
			transition: transform 160ms ease, background 160ms ease;
		}

		.boton-principal:hover {
			transform: translateY(-2px);
			background: #d6ff88;
		}

		footer {
			max-width: 1240px;
			margin: 0 auto;
			padding: 20px 32px 26px;
			color: #879287;
			font-size: 12px;
		}

		@keyframes aparecer {
			from { opacity: 0; transform: translateY(12px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				scroll-behavior: auto !important;
				animation-duration: 0.01ms !important;
				transition-duration: 0.01ms !important;
			}
		}
	</style>
</head>

<body>
	<header class="barra-superior">
		<a class="marca" href="index.html" aria-label="Level-Up Gamer, inicio">LEVEL-UP <span>GAMER</span></a>
		<nav class="navegacion" aria-label="Navegación principal">
			<a href="login/login.html">Login</a>
			<a href="registro/registro.html">Registro</a>
			<a href="productos/productos.html">Productos</a>
			<a href="carrito/carrito.html">Carrito</a>
			<a href="contacto/contacto.html">Contacto</a>
			<a href="nosotros/nosotros.html">Nosotros</a>
		</nav>
	</header>

	<main>
		<section class="portada" aria-labelledby="titulo-portada">
			<div class="portada-texto">
				<p class="sobrelinea">Tu próxima partida empieza aquí</p>
				<h1 id="titulo-portada">Sube de nivel tu setup.</h1>
				<p>Consolas, accesorios y todo lo que necesitas para jugar a tu manera.</p>
				<a class="boton-principal" href="productos/productos.html">Explorar productos</a>
			</div>
		</section>
	</main>

	<footer>© 2026 Level-Up Gamer</footer>
</body>

</html>
