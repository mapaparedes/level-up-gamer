<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrar Usuarios - Level-Up Gamer</title>

    <link rel="stylesheet" href="usuarios-admin.css">
</head>

<body>

    <!-- MENÚ LATERAL -->
    <aside class="menu-admin">

        <h2>LEVEL-UP</h2>
        <p>ADMIN</p>

        <nav>
            <a href="admin.html">🏠 Inicio</a>
            <a href="productos-admin.html">🎮 Productos</a>
            <a href="usuarios-admin.html">👥 Usuarios</a>
            <a href="../index.html">🛒 Ver tienda</a>
            <a href="#" id="cerrar-sesion">🚪 Cerrar sesión</a>
        </nav>

    </aside>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido">

        <header>

            <h1>Administrar Usuarios</h1>

            <p>
                Crea, edita y administra los usuarios de Level-Up Gamer.
            </p>

        </header>


        <!-- FORMULARIO -->
        <section class="formulario-contenedor">

            <h2 id="titulo-formulario">
                Nuevo usuario
            </h2>

            <form id="form-usuario">

                <!-- Índice usado al editar -->
                <input
                    type="hidden"
                    id="indice-usuario"
                >


                <!-- RUN -->
                <label for="run">
                    RUN *
                </label>

                <input
                    type="text"
                    id="run"
                    minlength="7"
                    maxlength="9"
                    placeholder="Ej: 19011022K"
                >

                <span
                    class="error"
                    id="error-run"
                ></span>


                <!-- NOMBRE -->
                <label for="nombre">
                    Nombre *
                </label>

                <input
                    type="text"
                    id="nombre"
                    maxlength="50"
                    placeholder="Ej: Jordan"
                >

                <span
                    class="error"
                    id="error-nombre"
                ></span>


                <!-- APELLIDOS -->
                <label for="apellidos">
                    Apellidos *
                </label>

                <input
                    type="text"
                    id="apellidos"
                    maxlength="100"
                    placeholder="Ej: Caro Pérez"
                >

                <span
                    class="error"
                    id="error-apellidos"
                ></span>


                <!-- CORREO -->
                <label for="correo">
                    Correo electrónico *
                </label>

                <input
                    type="email"
                    id="correo"
                    maxlength="100"
                    placeholder="Ej: usuario@gmail.com"
                >

                <span
                    class="error"
                    id="error-correo"
                ></span>


                <!-- CONTRASEÑA -->
                <label for="password">
                    Contraseña *
                </label>

                <input
                    type="password"
                    id="password"
                    minlength="4"
                    maxlength="10"
                    placeholder="Entre 4 y 10 caracteres"
                >

                <span
                    class="error"
                    id="error-password"
                ></span>


                <!-- FECHA NACIMIENTO -->
                <label for="fecha-nacimiento">
                    Fecha de nacimiento
                </label>

                <input
                    type="date"
                    id="fecha-nacimiento"
                >

                <span
                    class="error"
                    id="error-fecha-nacimiento"
                ></span>


                <!-- TIPO DE USUARIO -->
                <label for="rol">
                    Tipo de usuario *
                </label>

                <select id="rol">

                    <option value="">
                        Seleccione un tipo de usuario
                    </option>

                    <option value="Administrador">
                        Administrador
                    </option>

                    <option value="Vendedor">
                        Vendedor
                    </option>

                    <option value="Cliente">
                        Cliente
                    </option>

                </select>

                <span
                    class="error"
                    id="error-rol"
                ></span>


                <!-- REGIÓN -->
                <label for="region">
                    Región
                </label>

                <select id="region">

                    <option value="">
                        Seleccione una región
                    </option>

                    <option value="Metropolitana">
                        Metropolitana
                    </option>

                    <option value="Valparaiso">
                        Valparaíso
                    </option>

                    <option value="Biobio">
                        Biobío
                    </option>

                </select>

                <span
                    class="error"
                    id="error-region"
                ></span>


                <!-- COMUNA -->
                <label for="comuna">
                    Comuna
                </label>

                <select id="comuna">

                    <option value="">
                        Seleccione primero una región
                    </option>

                </select>

                <span
                    class="error"
                    id="error-comuna"
                ></span>


                <!-- DIRECCIÓN -->
                <label for="direccion">
                    Dirección *
                </label>

                <input
                    type="text"
                    id="direccion"
                    maxlength="300"
                    placeholder="Ej: Avenida Gamer 123"
                >

                <span
                    class="error"
                    id="error-direccion"
                ></span>


                <!-- BOTONES -->
                <div class="botones-formulario">

                    <button
                        type="submit"
                        id="btn-guardar"
                    >
                        Guardar usuario
                    </button>

                    <button
                        type="button"
                        id="btn-cancelar"
                        class="btn-cancelar"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>


        <!-- LISTADO -->
        <section class="listado">

            <h2>
                Usuarios registrados
            </h2>

            <div class="tabla-contenedor">

                <table>

                    <thead>

                        <tr>
                            <th>RUN</th>
                            <th>Nombre</th>
                            <th>Apellidos</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody id="tabla-usuarios">
                        <!-- JavaScript agrega los usuarios -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="usuarios-admin.js"></script>

</body>

</html>
