<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

        <title>Iniciar Sesión - Level-Up Gamer</title>
    
    <!-- Hoja de estilos del login -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Título principal -->
    
 
 <div class="logo-login">
    <img src="../img/login-logo.png" alt="Inicio de sesión">
</div>

    <!-- Formulario de inicio de sesión -->
    <form id="formLogin">

        <!-- Correo -->
        <label for="correo">Correo:</label>

        <input
            type="email"
            id="correo"
            placeholder="Ingrese su correo"
        >

        <span id="errorCorreo"></span>


        <!-- Contraseña -->
        <label for="password">Contraseña:</label>

        <input
            type="password"
            id="password"
            placeholder="Ingrese su contraseña"
        >

        <span id="errorPassword"></span>


        <!-- Botón para iniciar sesión -->
        <button type="submit">
            Iniciar Sesión
        </button>

    </form>


    <!-- Enlace para registrarse -->
    <p>
        ¿No tienes una cuenta?
        <a href="../registro/registro.html">Regístrate aquí</a>
    </p>
    <!-- Sube una carpeta y abre la página principal -->
    <p>
    <a href="../index.html">Volver al inicio</a>
    </p>

    <!-- JavaScript del login -->
    <script src="login.js"></script>

</body>

</html>
