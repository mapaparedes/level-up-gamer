<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del producto - Level-Up Gamer</title>

    <link rel="stylesheet" href="detalle-producto.css">
</head>

<body>

    <!-- Volver al inicio -->
    <a href="../index.html" class="btn-inicio">
        🏠 Inicio
    </a>

    <!-- Detalle del producto -->
    <main class="detalle-producto">

        <div class="imagen-contenedor">

            <img
                id="producto-imagen"
                src=""
                alt="Producto"
            >

        </div>


        <div class="informacion-producto">

            <h1 id="producto-nombre">
                Producto
            </h1>


            <p id="producto-descripcion">
                Descripción del producto
            </p>


            <p
                class="precio"
                id="producto-precio"
            >
                $0 CLP
            </p>


            <button
                type="button"
                id="btn-agregar"
            >
                Agregar al carrito
            </button>


            <a
                href="../index.html#productos"
                class="volver"
            >
                ← Volver a productos
            </a>

        </div>

    </main>


    <script src="detalle-producto.js"></script>

</body>

</html>
